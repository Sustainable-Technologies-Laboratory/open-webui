services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
#    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    gpus: all
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
#    image: ghcr.io/open-webui/open-webui:v0.6.9
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      # Expose Open WebUI on host port 3002 instead of 3000
      # (3000 is already in use on this server)
      - "3000:8080"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=
    restart: unless-stopped

  puppeteer:
    build:
      context: ./puppeteer-in-docker
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      NODE_ENV: "production"
      CHROMIUM_PATH: "/usr/bin/chromium"
      PORT: "8081"


volumes:
  ollama:
    external: true
    name: ollama
  open-webui: {}
#  puppeteer-in-docker: {}
